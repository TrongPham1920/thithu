<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IT005 Thi thử</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --ink: #172033;
        --muted: #687386;
        --blue: #2563eb;
        --ok: #16803c;
        --bad: #c62828;
        --line: #dfe5ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 9;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 12px 18px;
      }
      .bar {
        max-width: 1050px;
        margin: auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        margin-right: auto;
      }
      .pill {
        background: #eef4ff;
        padding: 7px 10px;
        border-radius: 10px;
        font-weight: 700;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        background: var(--blue);
        color: #fff;
      }
      .secondary {
        background: #edf0f5;
        color: #243047;
      }
      main {
        max-width: 1050px;
        margin: 18px auto;
        padding: 0 14px 80px;
      }
      .notice {
        padding: 12px 14px;
        background: #fff8e8;
        border: 1px solid #f1d48a;
        border-radius: 12px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin: 12px 0;
        box-shadow: 0 2px 8px #1f29370b;
      }
      .qhead {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .num {
        background: #e9f0ff;
        color: #1748b0;
        border-radius: 8px;
        padding: 4px 8px;
        font-weight: 800;
        white-space: nowrap;
      }
      .qtext {
        font-weight: 700;
        line-height: 1.45;
      }
      .opts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .opt {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .opt:hover {
        border-color: #9ab5f5;
      }
      input {
        margin-top: 3px;
      }
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .match {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 7px 10px;
        margin-top: 12px;
        align-items: center;
      }
      .exp {
        display: none;
        margin-top: 11px;
        padding: 10px 12px;
        border-radius: 9px;
        background: #f3f6fa;
        line-height: 1.45;
      }
      .correct {
        border-color: #6cc58a;
        background: #f0fbf4;
      }
      .wrong {
        border-color: #ef8d8d;
        background: #fff3f3;
      }
      .result {
        display: none;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin: 18px 0;
      }
      .score {
        font-size: 28px;
        font-weight: 900;
      }
      .navgrid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
        margin: 10px 0;
      }
      .navgrid button {
        padding: 7px 0;
        background: #e8edf5;
      }
      .navgrid button.done {
        background: #dbeafe;
        color: #1748b0;
      }
      @media (max-width: 700px) {
        .opts {
          grid-template-columns: 1fr;
        }
        .match {
          grid-template-columns: 1fr;
        }
        .navgrid {
          grid-template-columns: repeat(6, 1fr);
        }
      }
      @media print {
        header,
        .actions,
        .navgrid {
          display: none !important;
        }
        body {
          background: #fff;
        }
        main {
          margin: 0;
          max-width: none;
        }
        .card {
          box-shadow: none;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>IT005 · Thi thử</h1>
        <span class="pill" id="timer">00:00</span><span class="pill" id="progress">0/28 đã làm</span
        ><button class="secondary" onclick="resetQuiz()">Làm lại</button
        ><button class="primary" onclick="submitQuiz()">Nộp bài</button>
      </div>
    </header>
    <main>
      <div class="notice">
        <b>Bám theo đề thi thử bạn gửi.</b> Câu 18 và 23 cần hình đồ thị/mạng nhưng file nguồn không
        chứa hình, nên web giữ vị trí nhưng không tính điểm. 28 câu còn lại được chấm tự động. Câu
        sai sẽ hiện giải thích để làm lại nhiều vòng.
      </div>
      <div class="navgrid" id="nav"></div>
      <div id="quiz"></div>
      <div class="result" id="result">
        <div class="score" id="score"></div>
        <p id="summary"></p>
        <button class="primary" onclick="retryWrong()">Làm lại câu sai</button>
        <button class="secondary" onclick="resetQuiz()">Làm lại toàn bộ</button>
      </div>
    </main>
    <script>
      const Q = [
        {
          n: 1,
          q: "Alice lần đầu dùng trình duyệt xem trang web có 1 file HTML và 3 hình ảnh. Trình duyệt và Web Server đều dùng HTTP/1.1. Có bao nhiêu gói TCP SYN-ACK được máy Alice gửi đi trong bắt tay ba bước?",
          opts: ["0", "1", "4", "3"],
          a: 0,
          exp: "Alice là client: client gửi SYN và ACK; SYN-ACK do server gửi. Vì vậy máy Alice gửi 0 SYN-ACK. HTTP/1.1 dùng kết nối bền vững.",
        },
        {
          n: 2,
          q: "Địa chỉ IP nào hợp lệ để cấp phát cho host của mạng con 143.168.64.0/19?",
          opts: ["143.168.95.255", "143.168.95.0", "143.168.96.1", "143.168.63.111"],
          a: 1,
          exp: "/19 có block 32 ở octet 3. Mạng này chạy từ 143.168.64.0 đến 143.168.95.255; host hợp lệ: .64.1 đến .95.254.",
        },
        {
          n: 3,
          q: "Địa chỉ IP nào sau đây thuộc lớp B?",
          opts: ["203.5.6.7", "10.1.1.1", "127.255.2.2", "172.29.14.10"],
          a: 3,
          exp: "Class B có octet đầu từ 128 đến 191. 172 thuộc khoảng này.",
        },
        {
          n: 4,
          q: "Giao thức MAC nào mà kênh truyền được chia thành các phần nhỏ rồi cấp phát sử dụng độc quyền cho các node?",
          opts: ["CSMA/CD", "Phân hoạch kênh", "ALOHA", "Xoay vòng"],
          a: 1,
          exp: "Channel partitioning chia tài nguyên kênh theo thời gian/tần số/mã để các node dùng phần được cấp.",
        },
        {
          n: 5,
          q: "Ở tầng Vận chuyển, để phát hiện lỗi trong gói tin dùng kỹ thuật gì?",
          opts: ["Checksum", "Timer", "ACK", "CRC"],
          a: 0,
          exp: "TCP/UDP dùng Internet checksum để phát hiện lỗi.",
        },
        {
          n: 6,
          q: "Công ty cần mạng nội bộ cho 100 host từ một mạng lớp C. Subnet mask phù hợp nhất?",
          opts: ["255.255.255.128", "255.255.255.240", "255.255.255.192", "255.255.128.0"],
          a: 0,
          exp: "Cần h sao cho 2^h−2 ≥100. h=7 ⇒126 host ⇒ /25 = 255.255.255.128.",
        },
        {
          n: 7,
          q: "Điểm khác biệt nhất của RDT 2.2 so với RDT 2.1?",
          opts: [
            "Phát hiện mất gói",
            "Không sử dụng NAK",
            "Không sử dụng ACK",
            "Phát hiện ACK bị lỗi",
          ],
          a: 1,
          exp: "RDT 2.2 là NAK-free: dùng ACK lặp thay cho NAK.",
        },
        {
          n: 8,
          q: "Khối địa chỉ bắt đầu 199.34.76.64/28 có bao nhiêu địa chỉ có thể gán cho thiết bị?",
          opts: ["16", "8", "14", "32"],
          a: 2,
          exp: "/28 còn 4 bit host ⇒ 16 địa chỉ tổng, trừ network và broadcast ⇒14 host.",
        },
        {
          n: 9,
          q: "Ghép giao thức với cổng mặc định.",
          type: "match",
          pairs: [
            ["Telnet", "23"],
            ["SSH", "22"],
            ["HTTP", "80"],
            ["POP3", "110"],
            ["DNS", "53"],
            ["SMTP", "25"],
          ],
          choices: ["20", "21", "22", "23", "25", "53", "80", "110", "443"],
          exp: "Telnet 23, SSH 22, HTTP 80, POP3 110, DNS 53, SMTP 25.",
        },
        {
          n: 10,
          q: "Ngoài cấp địa chỉ IP, DHCP Server còn trả về thông tin nào sau đây?",
          opts: [
            "Tên và địa chỉ DHCP Server",
            "Default Gateway",
            "Tất cả đều đúng",
            "Physical Address",
          ],
          a: 1,
          exp: "Theo nội dung ôn tập, DHCP có thể cung cấp Default Gateway. Physical Address là MAC của client, không phải thông tin DHCP cấp cho client.",
        },
        {
          n: 11,
          q: "Byte đầu tiên của IPv4 là 11100001. Địa chỉ thuộc lớp nào?",
          opts: ["Lớp C", "Lớp B", "Lớp A", "Lớp D"],
          a: 3,
          exp: "11100001₂ = 225. Class D là 224–239 (bit đầu 1110).",
        },
        {
          n: 12,
          q: "Go-Back-N: A gửi gói 2,3,4,5,6; sau đó nhận ACK 2,3,5. Nhận định nào KHÔNG đúng?",
          opts: [
            "Gói 6 chưa được gửi thành công đến bên nhận",
            "Gói 4 chưa được gửi thành công đến bên nhận",
            "Gói 5 đã được gửi thành công đến bên nhận",
            "ACK của gói 4 có thể bị mất",
          ],
          a: 1,
          exp: "ACK trong GBN là tích lũy. ACK5 cho biết các gói đến 5 đã được nhận theo thứ tự; không thấy ACK4 không có nghĩa gói 4 thất bại.",
        },
        {
          n: 13,
          q: "Độ trễ nào phụ thuộc vào khoảng cách giữa các node?",
          opts: ["Trễ lan truyền", "Trễ xử lý", "Trễ xếp hàng", "Trễ truyền"],
          a: 0,
          exp: "Propagation delay = d/s, phụ thuộc khoảng cách d.",
        },
        {
          n: 14,
          q: "Phát biểu nào SAI về địa chỉ IP 172.15.1.0?",
          opts: [
            "Có subnet mask chuẩn 255.255.0.0",
            "Không thể cấp cho host vì là địa chỉ mạng",
            "Thuộc lớp B",
            "Là Public IP",
          ],
          a: 1,
          exp: "Theo classful /16, network là 172.15.0.0; 172.15.1.0 không phải network address. 172.15.x.x cũng nằm ngoài dải private 172.16–31.",
        },
        {
          n: 15,
          q: "Để kết nối trực tiếp hai máy tính với nhau, loại cable nào phù hợp nhất?",
          opts: ["Cáp thẳng", "Không có loại nào", "Cáp xoắn", "Cáp console"],
          a: 2,
          exp: "Theo cách gọi trong đề học phần, chọn cáp xoắn (crossover) để nối trực tiếp hai máy.",
        },
        {
          n: 16,
          q: "Ghép dịch vụ với chức năng.",
          type: "match",
          pairs: [
            ["DHCP", "Cấp phát địa chỉ IP tự động"],
            ["DNS", "Phân giải tên miền"],
            ["SMTP", "Gửi thư"],
            ["HTTP", "Truy cập dịch vụ web"],
            ["FTP", "Truyền tệp tin"],
            ["POP3", "Đọc thư"],
          ],
          choices: [
            "Cấp phát địa chỉ IP tự động",
            "Phân giải tên miền",
            "Gửi thư",
            "Truy cập dịch vụ web",
            "Truyền tệp tin",
            "Đọc thư",
          ],
          exp: "Đây là nhóm chức năng dịch vụ cơ bản cần thuộc lòng.",
        },
        {
          n: 17,
          q: "Địa chỉ quảng bá của mạng 192.168.25.128/27?",
          opts: ["192.168.25.100", "192.168.25.159", "192.168.25.128", "192.168.25.25"],
          a: 1,
          exp: "/27 ⇒ block 32. Block 128–159 ⇒ broadcast .159.",
        },
        {
          n: 18,
          q: "Dijkstra từ đỉnh u — câu gốc cần hình đồ thị.",
          type: "missing",
          exp: "File nguồn chỉ có câu hỏi và lựa chọn nhưng không chứa hình đồ thị. Không chấm tự động câu này để tránh tự suy đoán dữ liệu.",
        },
        {
          n: 19,
          q: "Địa chỉ IP nào không dùng để kết nối trên Internet?",
          opts: ["192.168.100.20", "126.0.0.1", "172.32.100.10", "11.10.1.1"],
          a: 0,
          exp: "192.168.0.0/16 là private theo RFC1918.",
        },
        {
          n: 20,
          q: "G=1101, D=10011101. CRC bits R đính kèm theo D là gì?",
          opts: ["100", "110", "111", "001"],
          a: 0,
          exp: "Bậc G là 3: chia modulo-2 D·2³ = 10011101000 cho 1101, phần dư là 100.",
        },
        {
          n: 21,
          q: "Datagram 4404 byte, IP header 20 byte, MTU=1500. Các trường của fragment thứ 3?",
          opts: [
            "FragFlag:1, Length:1424, Offset:18",
            "Tất cả đều sai",
            "FragFlag:1, Length:1444, Offset:370",
            "FragFlag:0, Length:1500, Offset:2960",
          ],
          a: 1,
          exp: "Data=4384; mỗi fragment đầu mang 1480. Fragment 3: data 1424, total length 1444, offset=(1480×2)/8=370, MF=0. Không lựa chọn nào khớp hoàn toàn.",
        },
        {
          n: 22,
          q: "Mạng lớp C cần chia thành 8 mạng con thì subnet mask nào?",
          opts: ["255.255.255.192", "255.255.255.224", "255.255.255.0", "255.255.255.240"],
          a: 1,
          exp: "Từ /24 cần 8=2³ subnet ⇒ mượn 3 bit ⇒ /27 = 255.255.255.224.",
        },
        {
          n: 23,
          q: "Bellman-Ford / Distance Vector — câu gốc cần hình mô hình mạng.",
          type: "missing",
          exp: "File nguồn không chứa hình mạng, nên không chấm tự động câu này để tránh tự dựng cạnh/trọng số.",
        },
        {
          n: 24,
          q: "TCP nhận segment Sequence Number=3000, Length=500 byte. Acknowledgement Number?",
          opts: ["2999", "3500", "3501", "3000"],
          a: 1,
          exp: "ACK = sequence number của byte kế tiếp = 3000+500 = 3500.",
        },
        {
          n: 25,
          q: "Mạng 205.100.16.0/255.255.248.0. IP nào thuộc mạng?",
          opts: ["205.100.15.20", "205.100.23.1", "205.101.16.2", "205.100.26.56"],
          a: 1,
          exp: "255.255.248.0=/21, block octet 3 là 8. Mạng 16–23 ⇒ 205.100.23.1 thuộc mạng.",
        },
        {
          n: 26,
          q: "Trong mô hình chồng giao thức Internet, tầng mạng chịu trách nhiệm?",
          opts: [
            "Truyền dữ liệu trên đường truyền",
            "Định tuyến dữ liệu từ nguồn đến đích",
            "Cung cấp địa chỉ IP cho thiết bị",
            "Mã hoá dữ liệu",
          ],
          a: 1,
          exp: "Network layer thực hiện forwarding/routing để đưa datagram từ nguồn đến đích.",
        },
        {
          n: 27,
          q: "Địa chỉ nào là địa chỉ tầng 2 (MAC)?",
          opts: ["192.168.1.100", "00-00-12-34-FE-AA", "0000.1234.FEG", "00-12-34-FE-GH"],
          a: 1,
          exp: "MAC có 48 bit, thường biểu diễn bằng 12 ký tự hex; hex chỉ gồm 0–9, A–F.",
        },
        {
          n: 28,
          q: "Công thức tính độ trễ lan truyền?",
          opts: ["d/s", "d/s - L/R", "d/s + L/R", "L/R"],
          a: 0,
          exp: "Propagation delay = distance / propagation speed = d/s.",
        },
        {
          n: 29,
          q: "Subnet mask mặc định của lớp A?",
          opts: ["Tất cả đều sai", "255.255.0.0", "255.255.255.0", "255.0.0.0"],
          a: 3,
          exp: "Class A mặc định /8 = 255.0.0.0.",
        },
        {
          n: 30,
          q: "Theo cách đánh địa chỉ theo lớp, IPv4 được chia thành bao nhiêu lớp?",
          opts: ["6", "4", "5", "3"],
          a: 2,
          exp: "5 lớp: A, B, C, D, E.",
        },
      ];
      let seconds = 0;
      let timer = setInterval(() => {
        seconds++;
        document.getElementById("timer").textContent =
          String(Math.floor(seconds / 60)).padStart(2, "0") +
          ":" +
          String(seconds % 60).padStart(2, "0");
      }, 1000);
      const quiz = document.getElementById("quiz"),
        nav = document.getElementById("nav");
      function render() {
        quiz.innerHTML = "";
        nav.innerHTML = "";
        Q.forEach((x) => {
          let nb = document.createElement("button");
          nb.textContent = x.n;
          nb.id = "nav" + x.n;
          nb.onclick = () =>
            document
              .getElementById("q" + x.n)
              .scrollIntoView({ behavior: "smooth", block: "center" });
          nav.appendChild(nb);
          let c = document.createElement("section");
          c.className = "card";
          c.id = "q" + x.n;
          c.innerHTML = `<div class="qhead"><span class="num">Câu ${x.n}</span><div class="qtext">${x.q}</div></div>`;
          if (x.type === "missing")
            c.innerHTML += `<div class="exp" style="display:block;background:#fff8e8">${x.exp}</div>`;
          else if (x.type === "match") {
            let m = document.createElement("div");
            m.className = "match";
            x.pairs.forEach((p, i) => {
              let l = document.createElement("b");
              l.textContent = p[0];
              let s = document.createElement("select");
              s.dataset.i = i;
              s.innerHTML =
                '<option value="">-- chọn --</option>' +
                x.choices.map((v) => `<option>${v}</option>`).join("");
              s.onchange = update;
              m.append(l, s);
            });
            c.appendChild(m);
          } else {
            let o = document.createElement("div");
            o.className = "opts";
            x.opts.forEach((v, i) => {
              let lab = document.createElement("label");
              lab.className = "opt";
              lab.innerHTML = `<input type="radio" name="q${x.n}" value="${i}"> <span><b>${"0123".includes(i) ? String.fromCharCode(65 + i) : ""}</b> ${v}</span>`;
              lab.querySelector("input").onchange = update;
              o.appendChild(lab);
            });
            c.appendChild(o);
          }
          if (x.type !== "missing") {
            let e = document.createElement("div");
            e.className = "exp";
            e.id = "e" + x.n;
            e.textContent = x.exp;
            c.appendChild(e);
          }
          quiz.appendChild(c);
        });
        update();
      }
      function answered(x) {
        if (x.type === "missing") return false;
        if (x.type === "match")
          return [...document.querySelectorAll(`#q${x.n} select`)].every((s) => s.value);
        return !!document.querySelector(`input[name=q${x.n}]:checked`);
      }
      function update() {
        let n = 0;
        Q.forEach((x) => {
          if (answered(x)) {
            n++;
            document.getElementById("nav" + x.n).classList.add("done");
          } else document.getElementById("nav" + x.n).classList.remove("done");
        });
        document.getElementById("progress").textContent = n + "/28 đã làm";
      }
      function isCorrect(x) {
        if (x.type === "match")
          return [...document.querySelectorAll(`#q${x.n} select`)].every(
            (s, i) => s.value === x.pairs[i][1],
          );
        let r = document.querySelector(`input[name=q${x.n}]:checked`);
        return r && +r.value === x.a;
      }
      function submitQuiz() {
        let sc = 0,
          total = 0,
          wrong = [];
        Q.forEach((x) => {
          if (x.type === "missing") return;
          total++;
          let ok = isCorrect(x);
          if (ok) sc++;
          else wrong.push(x.n);
          let c = document.getElementById("q" + x.n);
          c.classList.remove("correct", "wrong");
          c.classList.add(ok ? "correct" : "wrong");
          document.getElementById("e" + x.n).style.display = "block";
          if (!x.type && x.type !== "match") {
            document.querySelectorAll(`input[name=q${x.n}]`).forEach((r) => {
              let lab = r.closest(".opt");
              if (+r.value === x.a) lab.style.borderColor = "#54ad72";
            });
          }
        });
        clearInterval(timer);
        let pct = Math.round((sc / total) * 100);
        document.getElementById("score").textContent = `${sc}/${total} · ${pct}%`;
        document.getElementById("summary").textContent = wrong.length
          ? "Câu cần làm lại: " + wrong.join(", ")
          : "Bạn đã đúng toàn bộ các câu có thể chấm tự động.";
        document.getElementById("result").style.display = "block";
        document.getElementById("result").scrollIntoView({ behavior: "smooth" });
        localStorage.setItem("it005_last", JSON.stringify({ sc, total, wrong, seconds }));
      }
      function resetQuiz() {
        if (!confirm("Xóa đáp án hiện tại và làm lại từ đầu?")) return;
        document.querySelectorAll("input").forEach((x) => (x.checked = false));
        document.querySelectorAll("select").forEach((x) => (x.value = ""));
        document.querySelectorAll(".card").forEach((x) => x.classList.remove("correct", "wrong"));
        document.querySelectorAll(".exp").forEach((x) => {
          if (!x.closest(".card")?.querySelector(".num")?.textContent.match(/18|23/))
            x.style.display = "none";
        });
        document.getElementById("result").style.display = "none";
        seconds = 0;
        clearInterval(timer);
        timer = setInterval(() => {
          seconds++;
          document.getElementById("timer").textContent =
            String(Math.floor(seconds / 60)).padStart(2, "0") +
            ":" +
            String(seconds % 60).padStart(2, "0");
        }, 1000);
        update();
        scrollTo(0, 0);
      }
      function retryWrong() {
        let wrong = [];
        Q.forEach((x) => {
          if (x.type !== "missing" && !isCorrect(x)) wrong.push(x.n);
        });
        document
          .querySelectorAll(".card")
          .forEach((c) => (c.style.display = wrong.includes(+c.id.slice(1)) ? "block" : "none"));
        document.getElementById("result").style.display = "none";
        scrollTo(0, 0);
      }
      render();
    </script>
  </body>
</html>
